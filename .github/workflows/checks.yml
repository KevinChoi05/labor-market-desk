name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Worker tests
        working-directory: worker
        run: npm ci && npm test
      - name: Data checks on saved data
        run: python3 scripts/fetch_bls.py --check-only
      - name: Page builds
        run: python3 scripts/build.py
